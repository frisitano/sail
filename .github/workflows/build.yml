name: Build matrix

on: [push, workflow_dispatch]

# Required for vcpkg binary caching. See
# https://learn.microsoft.com/en-us/vcpkg/github-integration
permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_FEATURE_FLAGS: dependencygraph
  OPAMVERBOSE: 1

jobs:
  build:
    strategy:
      # Without this one failing leg cancels the others, so a single flaky
      # runner hides whether the rest of the matrix is healthy.
      fail-fast: false
      matrix:
        ocaml_version: [4.14.3, 5.2.1]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
        exclude:
        - os: macos-26
          ocaml_version: 4.14.3
        # Windows is only supported by OCaml 5 or later.
        - os: windows-2025
          ocaml_version: 4.14.3

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: System dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt install build-essential libgmp-dev cvc4

    - name: System dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install --force --overwrite gpatch gmp pkgconf

    - name: System dependencies (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install gmp

    # Every leg must solve with the SAME Z3: a different version makes that
    # leg's typechecking results incomparable with the others, and the
    # distribution packages are far behind (apt on noble carries 4.8.x).
    #
    # cda-tum/setup-z3 resolves the release through the GitHub API, which has
    # returned 503 / 'socket hang up' on us repeatedly -- linux/arm64 first,
    # then windows, different runs. The z3-solver wheel is the same upstream
    # build behind a different CDN, is published for all six runner platforms
    # we use, and ships a statically linked z3 executable that runs without
    # libz3 beside it. A throwaway venv means we own the directory we put on
    # PATH instead of guessing at a user/system install scheme.
    #
    # The executable ships under the wheel's *data* scheme (data/bin/z3), which
    # installs relative to sys.prefix as <venv>/bin -- on Windows that is NOT
    # the Scripts directory that holds python.exe. So locate it rather than
    # assuming the two coincide, as they do only on POSIX.
    - name: Setup Z3
      shell: bash
      run: |
        set -euo pipefail
        venv="${RUNNER_TEMP}/z3venv"
        py=python3; command -v "$py" >/dev/null 2>&1 || py=python
        "$py" -m venv "$venv"

        pybin="$venv/bin"
        [ -x "$venv/Scripts/python.exe" ] && pybin="$venv/Scripts"
        "$pybin/python" -m pip install --quiet --disable-pip-version-check \
          "z3-solver==4.15.3.0"

        z3bin=
        for d in "$venv/bin" "$venv/Scripts"; do
          if [ -f "$d/z3" ] || [ -f "$d/z3.exe" ]; then z3bin="$d"; break; fi
        done
        if [ -z "$z3bin" ]; then
          echo "::error::no z3 executable under $venv after installing the wheel"
          ls -R "$venv" | head -60
          exit 1
        fi

        z3exe="$z3bin/z3"; [ -f "$z3exe" ] || z3exe="$z3bin/z3.exe"
        echo "$z3bin" >> "$GITHUB_PATH"
        "$z3exe" --version

    - name: Set-up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml_version }}

    - name: Set LEMLIB env var
      if: runner.os == 'Windows'
      # Note we can't use `opam var lem:share` because lem hasn't been installed yet.
      run: echo "LEMLIB=$(opam var share)\lem\library" >> $env:GITHUB_ENV

    # This contains a fix for paths on Windows but hasn't been released yet.
    - name: Pin latest linksem
      if: runner.os == 'Windows'
      run: opam pin add linksem https://github.com/rems-project/linksem.git

    # Workaround for https://github.com/rems-project/lem/issues/38
    - name: Install and fix lem
      if: runner.os == 'Windows'
      run: |
        opam install lem
        Rename-Item -Path "$(opam var lem:bin)\lem" -NewName "lem.exe"

    - name: Install Sail
      run: |
        opam pin --yes --no-action add .
        opam install sail --yes

    # test/run_core_tests.sh runs test/python/run_tests.py, whose generated
    # code imports ethereum_types.
    - name: Python test dependencies
      if: runner.os != 'Windows'
      run: pip install --user --break-system-packages ethereum-types==0.4.1 || pip install --user ethereum-types==0.4.1

    - name: Test Sail
      # Tests use lots of unix-isms currently (fork, mkdir -p, etc).
      if: runner.os != 'Windows'
      run: |
        opam exec -- bash etc/ci_core_tests.sh

  build-docker:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Build Dockerfile.nightly
      run: |
        docker build . -t sail -f ./Dockerfile.nightly --no-cache --progress plain
